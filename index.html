<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>You Chose to Care</title>

<style>
body {
    font-family: Arial;
    background: #0b0b0b;
    color: white;
    padding: 20px;
}

h1 {
    margin-bottom: 10px;
}

/* Top bar (kept simple) */
.topBar button {
    margin-right: 10px;
    padding: 6px 12px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

/* POSTS */
.post {
    background: rgba(255,255,255,0.06);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.post img {
    max-width: 100%;
    border-radius: 8px;
    margin-top: 10px;
}

/* COMMENTS */
.commentsBox {
    margin-top: 10px;
    padding: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
}

/* PEOPLE SECTION */
.peopleSection {
    margin-top: 40px;
    padding: 15px;
    background: rgba(255,255,255,0.05);
    border-radius: 14px;
}

.peopleHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
</style>
</head>

<body>

<h1>You Chose to Care</h1>

<div class="topBar">
    <button onclick="createAccount()">Create Account</button>
    <button onclick="toggleAdmin()">Admin Mode</button>
    <button onclick="addPost()">+ Post</button>
</div>

<!-- POSTS -->
<div id="posts"></div>

<!-- PEOPLE -->
<div class="peopleSection">
    <div class="peopleHeader">
        <h2>People Who Care</h2>
        <button onclick="joinPeople()">Join</button>
    </div>
    <div id="people"></div>
</div>

<script>

/* ---------------- DATA ---------------- */
let posts = JSON.parse(localStorage.getItem("posts")) || [];
let people = JSON.parse(localStorage.getItem("people")) || [];
let currentUser = localStorage.getItem("user") || null;
let isAdmin = false;

/* ---------------- ACCOUNT ---------------- */
function createAccount() {
    let name = prompt("Enter your name");
    if (!name) return;
    currentUser = name;
    localStorage.setItem("user", name);
}

function toggleAdmin() {
    if (!isAdmin) {
        let pass = prompt("Enter admin password");
        if (pass === "admin123") {
            isAdmin = true;
            alert("Admin mode ON");
        }
    } else {
        isAdmin = false;
        alert("Admin mode OFF");
    }
}

/* ---------------- POSTS ---------------- */
function addPost() {
    if (!currentUser && !isAdmin) {
        alert("Create account first");
        return;
    }

    let title = prompt("Title (optional)");
    let body = prompt("Post text");
    if (!body) return;

    let image = prompt("Image URL (optional)");

    let author = isAdmin
        ? (prompt("Admin name or leave blank for ADMIN") || "ADMIN")
        : currentUser;

    posts.unshift({
        title,
        body,
        text: body, // compatibility
        image,
        author,
        likes: 0,
        dislikes: 0,
        comments: []
    });

    save();
}

function renderPosts() {
    let container = document.getElementById("posts");
    container.innerHTML = "";

    posts.forEach((p, i) => {

        let text = p.body || p.text || "";

        let div = document.createElement("div");
        div.className = "post";

        div.innerHTML = `
            ${p.title ? `<h3>${p.title}</h3>` : ""}
            <div>${text}</div>
            ${p.image ? `<img src="${p.image}">` : ""}

            <div style="margin-top:10px;">
                👍 ${p.likes || 0}
                <button onclick="like(${i})">+</button>

                👎 ${p.dislikes || 0}
                <button onclick="dislike(${i})">-</button>
            </div>

            <div style="margin-top:10px;">
                <button onclick="addComment(${i})">Comment</button>
            </div>

            <div class="commentsBox">
                ${(p.comments || []).map(c => `<div><b>${c.user}:</b> ${c.text}</div>`).join("")}
            </div>

            ${isAdmin ? `<button onclick="deletePost(${i})">Delete</button>` : ""}
        `;

        container.appendChild(div);
    });
}

function like(i) {
    posts[i].likes = (posts[i].likes || 0) + 1;
    save();
}

function dislike(i) {
    posts[i].dislikes = (posts[i].dislikes || 0) + 1;
    save();
}

function deletePost(i) {
    posts.splice(i, 1);
    save();
}

/* ---------------- COMMENTS ---------------- */
function addComment(i) {
    if (!currentUser && !isAdmin) {
        alert("Create account first");
        return;
    }

    let text = prompt("Comment");
    if (!text) return;

    let user = isAdmin
        ? (prompt("Admin name or blank") || "ADMIN")
        : currentUser;

    posts[i].comments.push({ user, text });
    save();
}

/* ---------------- PEOPLE ---------------- */
function joinPeople() {
    if (!currentUser && !isAdmin) {
        alert("Create account first");
        return;
    }

    let name, action;

    if (isAdmin) {
        name = prompt("Person name");
        action = prompt("Their action");
    } else {
        name = currentUser;

        // prevent duplicate join
        if (people.some(p => p.name === name)) {
            alert("You already joined");
            return;
        }

        action = prompt("What did you do?");
    }

    people.push({ name, action });
    save();
}

function renderPeople() {
    let container = document.getElementById("people");
    container.innerHTML = "";

    people.forEach(p => {
        let div = document.createElement("div");
        div.innerHTML = `<b>${p.name}</b>: ${p.action}`;
        container.appendChild(div);
    });
}

/* ---------------- SAVE ---------------- */
function save() {
    localStorage.setItem("posts", JSON.stringify(posts));
    localStorage.setItem("people", JSON.stringify(people));
    renderPosts();
    renderPeople();
}

/* ---------------- INIT ---------------- */
renderPosts();
renderPeople();

</script>

</body>
</html>
