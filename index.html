<script> const PASSWORD = "care2026"; let account = JSON.parse(localStorage.getItem("account") || "null"); let users = JSON.parse(localStorage.getItem("users") || "[]"); let posts = JSON.parse(localStorage.getItem("posts") || "[]"); let isAdmin = false; /* SAVE */ function saveUsers() { localStorage.setItem("users", JSON.stringify(users)); } function savePosts() { localStorage.setItem("posts", JSON.stringify(posts)); renderPosts(); } /* ACCOUNT */ function createAccount() { if (account && !isAdmin) { alert("You already have an account on this device."); return; } let name = prompt("Create username:"); if (!name) return; account = { name: name.trim() }; localStorage.setItem("account", JSON.stringify(account)); alert("Logged in as " + account.name); } /* ADMIN */ function adminLogin() { let p = prompt("Enter password:"); if (p === PASSWORD) { isAdmin = true; alert("Admin mode enabled"); } } /* JOIN */ function join() { if (!account && !isAdmin) { alert("Create an account first."); return; } if (!isAdmin) { if (users.some(u => u.name === account.name)) { alert("You already joined."); return; } } let action = prompt("What will you do to help?"); users.push({ name: account ? account.name : "Admin", action: action || "" }); saveUsers(); renderUsers(); } /* USERS */ function renderUsers() { document.getElementById("count").innerText = users.length + " people"; const box = document.getElementById("people"); box.innerHTML = ""; users.forEach(u => { const div = document.createElement("div"); div.className = "item"; div.innerHTML = ` ${u.name}
${u.action || "No action added"} `; box.appendChild(div); }); } /* POSTS */ function addPost() { if (!account && !isAdmin) { alert("Create account first"); return; } let text = document.getElementById("postInput").value; if (!text.trim()) return; posts.push({ user: account ? account.name : "Admin", text: text.trim(), likes: 0, likedBy: [], comments: [] }); document.getElementById("postInput").value = ""; savePosts(); } /* LIKE / UNLIKE FIXED */ function likePost(i) { if (!account || !account.name) { alert("Create an account first to like posts."); return; } let p = posts[i]; let user = account.name; if (!p.likedBy) p.likedBy = []; if (p.likedBy.includes(user)) { p.likedBy = p.likedBy.filter(x => x !== user); } else { p.likedBy.push(user); } p.likes = p.likedBy.length; savePosts(); } /* COMMENT */ function commentPost(i) { let c = prompt("Comment:"); if (!c) return; posts[i].comments.push({ user: account ? account.name : "Anonymous", text: c }); savePosts(); } /* RENDER POSTS */ function renderPosts() { const box = document.getElementById("posts"); box.innerHTML = ""; posts.forEach((p, i) => { const div = document.createElement("div"); div.className = "post"; div.innerHTML = ` ${p.user}
${p.text}

❤️ ${p.likes} ${account && p.likedBy.includes(account.name) ? "Unlike" : "Like"} Comment
${p.comments.map(c => `
${c.user}: ${c.text}
`).join("")}
`; box.appendChild(div); }); } /* INIT */ renderUsers(); renderPosts(); </script>
