<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>You Chose to Care</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    margin: 0;
    padding: 20px;
}

/* BUTTONS */
button {
    margin: 5px;
    padding: 8px 12px;
    cursor: pointer;
}

/* POSTS */
.post {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    margin: 15px 0;
    border-radius: 10px;
    position: relative;
}

/* COMMENTS BOX */
.commentsBox {
    margin-top: 10px;
    padding: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
}

/* DROPDOWN FIX */
.dropdown {
    position: absolute;
    right: 10px;
    top: 100%;
    margin-top: 5px;
    background: black;
    border-radius: 8px;
    display: none;
    flex-direction: column;
    z-index: 9999;
}

.dropdown button {
    background: none;
    color: white;
    border: none;
    padding: 8px;
}

/* PEOPLE SECTION */
.peopleBox {
    margin-top: 20px;
    padding: 15px;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
}
</style>
</head>

<body>

<h2>You Chose to Care</h2>

<button onclick="createAccount()">Create Account</button>
<button onclick="toggleAdmin()">Toggle Admin</button>
<button onclick="joinPeople()">Join People Who Care</button>
<button onclick="addPost()">Add Post</button>

<div id="posts"></div>

<div class="peopleBox">
    <h3>People Who Care</h3>
    <div id="people"></div>
</div>

<script>
const PASSWORD = "Care2026";

/* USER SYSTEM */
let currentUser = localStorage.getItem("currentUser") || null;
let isAdmin = localStorage.getItem("isAdmin") === "true";

/* DATA */
let posts = JSON.parse(localStorage.getItem("posts")) || [];
let comments = JSON.parse(localStorage.getItem("comments")) || {};
let people = JSON.parse(localStorage.getItem("people")) || [];

/* ACCOUNT */
function createAccount() {
    let name = prompt("Enter your name:");
    if (!name) return;

    currentUser = name;
    localStorage.setItem("currentUser", name);
    alert("Account created!");
}

function toggleAdmin() {
    if (!isAdmin) {
        if (prompt("Enter admin password:") === PASSWORD) {
            isAdmin = true;
            localStorage.setItem("isAdmin", "true");
            alert("Admin mode ON");
        } else {
            alert("Wrong password");
        }
    } else {
        isAdmin = false;
        localStorage.setItem("isAdmin", "false");
        alert("Admin mode OFF");
    }
}

/* PEOPLE */
function joinPeople() {
    if (!currentUser && !isAdmin) {
        alert("Create account first");
        return;
    }

    if (!isAdmin) {
        if (people.find(p => p.name === currentUser)) {
            alert("You already joined!");
            return;
        }

        let action = prompt("What did you do?");
        if (!action) return;

        people.push({ name: currentUser, action });

    } else {
        let name = prompt("Enter name:");
        let action = prompt("Enter action:");
        if (!name || !action) return;

        people.push({ name, action });
    }

    savePeople();
}

function savePeople() {
    localStorage.setItem("people", JSON.stringify(people));
    renderPeople();
}

/* POSTS */
function addPost() {
    if (!currentUser && !isAdmin) {
        alert("Create account first");
        return;
    }

    let title = prompt("Title (optional):") || "";
    let body = prompt("Write your post:");
    let image = prompt("Image URL (optional):") || "";

    if (!body) return;

    let author = isAdmin
        ? (confirm("Post as admin?") ? "ADMIN" : prompt("Enter name:"))
        : currentUser;

    posts.unshift({
        title,
        body,
        image,
        author,
        likes: 0,
        dislikes: 0
    });

    savePosts();
}

function savePosts() {
    localStorage.setItem("posts", JSON.stringify(posts));
    renderPosts();
}

/* REACTIONS */
function react(i, type) {
    if (type === "like") posts[i].likes++;
    if (type === "dislike") posts[i].dislikes++;
    savePosts();
}

/* COMMENTS */
function addComment(i) {
    if (!currentUser && !isAdmin) {
        alert("Create account first");
        return;
    }

    let text = prompt("Write comment:");
    if (!text) return;

    let author = isAdmin
        ? (confirm("Comment as admin?") ? "ADMIN" : prompt("Enter name:"))
        : currentUser;

    if (!comments[i]) comments[i] = [];

    comments[i].push({ text, author });

    saveComments();
}

function saveComments() {
    localStorage.setItem("comments", JSON.stringify(comments));
    renderPosts();
}

/* DELETE */
function deletePost(i) {
    if (prompt("Password:") !== PASSWORD) return;
    posts.splice(i, 1);
    savePosts();
}

/* RENDER POSTS */
function renderPosts() {
    let container = document.getElementById("posts");
    container.innerHTML = "";

    posts.forEach((p, i) => {
        let div = document.createElement("div");
        div.className = "post";

        div.innerHTML = `
            <div style="display:flex; justify-content:space-between;">
                <strong>${p.author === "ADMIN" ? "👑 ADMIN" : p.author}</strong>
                ${isAdmin ? `<span onclick="deletePost(${i})">🗑</span>` : ""}
            </div>

            ${p.title ? `<h3>${p.title}</h3>` : ""}
            <p>${p.body}</p>
            ${p.image ? `<img src="${p.image}" style="max-width:100%">` : ""}

            <div>
                👍 ${p.likes}
                <button onclick="react(${i}, 'like')">Like</button>

                👎 ${p.dislikes}
                <button onclick="react(${i}, 'dislike')">Dislike</button>
            </div>

            <button onclick="addComment(${i})">Comment</button>

            <div class="commentsBox">
                ${(comments[i] || []).map(c => `
                    <div><b>${c.author === "ADMIN" ? "👑 ADMIN" : c.author}:</b> ${c.text}</div>
                `).join("")}
            </div>
        `;

        container.appendChild(div);
    });
}

/* RENDER PEOPLE */
function renderPeople() {
    let container = document.getElementById("people");
    container.innerHTML = "";

    people.forEach(p => {
        let div = document.createElement("div");
        div.innerHTML = `<b>${p.name}</b>: ${p.action}`;
        container.appendChild(div);
    });
}

/* INIT */
renderPosts();
renderPeople();
</script>

</body>
</html>
