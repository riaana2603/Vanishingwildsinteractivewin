<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>You Chose to Care</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
}

/* HERO SECTION */
.hero {
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero h1 {
    font-size: 50px;
}

.hero p {
    max-width: 600px;
}

/* GLASS EFFECT */
.glass {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding: 15px;
    border-radius: 15px;
    margin-top: 20px;
}

/* INPUT */
input {
    padding: 10px;
    border-radius: 20px;
    border: none;
    width: 250px;
}

button {
    padding: 8px 15px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    margin-left: 5px;
}

/* POSTS */
.post {
    margin-top: 15px;
}

.post img {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
}

/* COMMENTS */
.commentsBox {
    margin-top: 10px;
    background: rgba(255,255,255,0.2);
    padding: 10px;
    border-radius: 10px;
}

/* PEOPLE */
.peopleSection {
    margin-top: 40px;
}
</style>
</head>

<body>

<div class="hero">
    <h1>You Chose to Care</h1>
    <p>Wildfires are destroying habitats. A few people choose to act instead of scroll.</p>

    <div class="glass">
        <button onclick="createAccount()">Create Account</button>
        <button onclick="toggleAdmin()">Admin</button>
        <button onclick="joinPeople()">Join</button>
    </div>

    <div class="glass">
        <input id="postInput" placeholder="Write something...">
        <button onclick="addPost()">Post</button>
    </div>

    <div id="posts"></div>

    <div class="glass peopleSection">
        <h2>People Who Care</h2>
        <div id="people"></div>
    </div>
</div>

<script>

/* -------- DATA -------- */
let posts = JSON.parse(localStorage.getItem("posts")) || [];
let people = JSON.parse(localStorage.getItem("people")) || [];

let currentUser = localStorage.getItem("user") || null;
let isAdmin = false;

/* -------- ACCOUNT -------- */
function createAccount() {
    let name = prompt("Enter your name");
    if (!name) return;
    currentUser = name;
    localStorage.setItem("user", name);
}

/* -------- ADMIN -------- */
function toggleAdmin() {
    if (!isAdmin) {
        let pass = prompt("Password?");
        if (pass === "admin123") {
            isAdmin = true;
            alert("Admin ON");
        }
    } else {
        isAdmin = false;
        alert("Admin OFF");
    }
}

/* -------- POST -------- */
function addPost() {
    let input = document.getElementById("postInput");
    let body = input.value;
    if (!body) return;

    let title = prompt("Title (optional)");
    let image = prompt("Image URL (optional)");

    let author = isAdmin
        ? (prompt("Admin name or blank") || "ADMIN")
        : currentUser;

    posts.unshift({
        title,
        body,
        text: body,
        image,
        author,
        likes: 0,
        dislikes: 0,
        comments: []
    });

    input.value = "";
    save();
}

/* -------- RENDER POSTS -------- */
function renderPosts() {
    let container = document.getElementById("posts");
    container.innerHTML = "";

    posts.forEach((p, i) => {

        let text = p.body || p.text || "";

        let div = document.createElement("div");
        div.className = "glass post";

        div.innerHTML = `
            ${p.title ? `<h3>${p.title}</h3>` : ""}
            <div>${text}</div>
            ${p.image ? `<img src="${p.image}">` : ""}

            <div style="margin-top:10px;">
                ❤️ ${p.likes || 0}
                <button onclick="like(${i})">Like</button>

                👎 ${p.dislikes || 0}
                <button onclick="dislike(${i})">Dislike</button>
            </div>

            <button onclick="addComment(${i})">Comment</button>

            <div class="commentsBox">
                ${(p.comments || []).map(c =>
                    `<div><b>${c.user}:</b> ${c.text}</div>`
                ).join("")}
            </div>

            ${isAdmin ? `<button onclick="deletePost(${i})">Delete</button>` : ""}
        `;

        container.appendChild(div);
    });
}

/* -------- REACTIONS -------- */
function like(i) {
    posts[i].likes++;
    save();
}

function dislike(i) {
    posts[i].dislikes++;
    save();
}

/* -------- COMMENTS -------- */
function addComment(i) {
    let text = prompt("Comment");
    if (!text) return;

    let user = isAdmin
        ? (prompt("Admin name or blank") || "ADMIN")
        : currentUser;

    posts[i].comments.push({ user, text });
    save();
}

/* -------- PEOPLE -------- */
function joinPeople() {

    let name, action;

    if (isAdmin) {
        name = prompt("Name");
        action = prompt("Action");
    } else {
        name = currentUser;

        if (!name) {
            alert("Create account first");
            return;
        }

        if (people.some(p => p.name === name)) {
            alert("Already joined");
            return;
        }

        action = prompt("What did you do?");
    }

    people.push({ name, action });
    save();
}

function renderPeople() {
    let container = document.getElementById("people");
    container.innerHTML = "";

    people.forEach(p => {
        let div = document.createElement("div");
        div.innerHTML = `<b>${p.name}</b>: ${p.action}`;
        container.appendChild(div);
    });
}

/* -------- SAVE -------- */
function save() {
    localStorage.setItem("posts", JSON.stringify(posts));
    localStorage.setItem("people", JSON.stringify(people));
    renderPosts();
    renderPeople();
}

/* -------- INIT -------- */
renderPosts();
renderPeople();

</script>

</body>
</html>
