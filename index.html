<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>You Chose to Care</title>

<style>

/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: white;
}

/* ===== HERO ===== */
.hero {
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') center/cover no-repeat;
    text-align: center;
    padding-top: 80px;
}

/* ===== TEXT ===== */
.hero h1 {
    font-size: 52px;
    margin-bottom: 10px;
}

.hero p {
    max-width: 600px;
    margin: auto;
    font-size: 16px;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

/* ===== GLASS ===== */
.glass {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(14px);
    padding: 16px;
    border-radius: 18px;
    margin: 20px auto;
    width: 90%;
    max-width: 650px;
}

/* ===== INPUT ===== */
.inputRow {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 25px;
    border: none;
}

/* ===== BUTTON ===== */
button {
    background: rgba(255,255,255,0.8);
    color: black;
    border: none;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: white;
}

/* ===== POSTS ===== */
.post {
    text-align: left;
}

.post img {
    width: 100%;
    border-radius: 12px;
    margin-top: 10px;
}

/* ===== COMMENTS ===== */
.commentsBox {
    margin-top: 12px;
    padding: 10px;
    border-radius: 12px;
    background: rgba(0,0,0,0.25);
}

/* ===== PEOPLE ===== */
.peopleSection {
    margin-top: 40px;
}

.peopleSection h2 {
    margin-bottom: 10px;
}

</style>
</head>

<body>

<div class="hero">

<h1>You Chose to Care</h1>
<p>Wildfires are destroying habitats. A few people choose to act instead of scroll.</p>

<!-- CONTROLS -->
<div class="glass">
    <button onclick="createAccount()">Create Account</button>
    <button onclick="toggleAdmin()">Admin Mode</button>
    <button onclick="joinPeople()">Join</button>
</div>

<!-- POST INPUT -->
<div class="glass">
    <div class="inputRow">
        <input id="postInput" placeholder="Write something...">
        <button onclick="addPost()">Post</button>
    </div>
</div>

<!-- POSTS -->
<div id="posts"></div>

<!-- PEOPLE -->
<div class="glass peopleSection">
    <h2>People Who Care</h2>
    <div id="people"></div>
</div>

</div>

<script>

/* ===== STATE ===== */
let posts = JSON.parse(localStorage.getItem("posts")) || [];
let people = JSON.parse(localStorage.getItem("people")) || [];

let currentUser = localStorage.getItem("user") || null;
let isAdmin = false;

/* ===== DATA RECOVERY (IMPORTANT) ===== */
posts = posts.map(p => {
    return {
        title: p.title || "",
        body: p.body || p.text || "",
        image: p.image || "",
        author: p.author || "Unknown",
        likes: p.likes || 0,
        dislikes: p.dislikes || 0,
        comments: p.comments || []
    };
});

/* ===== ACCOUNT ===== */
function createAccount() {
    const name = prompt("Enter your name:");
    if (!name) return;
    currentUser = name;
    localStorage.setItem("user", name);
}

/* ===== ADMIN ===== */
function toggleAdmin() {
    if (!isAdmin) {
        const pass = prompt("Password:");
        if (pass === "admin123") {
            isAdmin = true;
            alert("Admin ON");
        }
    } else {
        isAdmin = false;
        alert("Admin OFF");
    }
}

/* ===== ADD POST ===== */
function addPost() {

    if (!currentUser && !isAdmin) {
        alert("Create account first");
        return;
    }

    const body = document.getElementById("postInput").value.trim();
    if (!body) return;

    const title = prompt("Title (optional):");
    const image = prompt("Image URL (optional):");

    const author = isAdmin
        ? (prompt("Admin name or blank") || "ADMIN")
        : currentUser;

    posts.unshift({
        title: title || "",
        body: body,
        image: image || "",
        author: author,
        likes: 0,
        dislikes: 0,
        comments: []
    });

    document.getElementById("postInput").value = "";
    save();
}

/* ===== RENDER POSTS ===== */
function renderPosts() {

    const container = document.getElementById("posts");
    container.innerHTML = "";

    posts.forEach((p, i) => {

        const el = document.createElement("div");
        el.className = "glass post";

        el.innerHTML = `
            ${p.title ? `<h3>${p.title}</h3>` : ""}
            <p>${p.body}</p>
            ${p.image ? `<img src="${p.image}">` : ""}

            <div>
                👍 ${p.likes}
                <button onclick="like(${i})">+</button>

                👎 ${p.dislikes}
                <button onclick="dislike(${i})">-</button>
            </div>

            <button onclick="comment(${i})">Comment</button>

            <div class="commentsBox">
                ${p.comments.map(c =>
                    `<div><b>${c.user}:</b> ${c.text}</div>`
                ).join("")}
            </div>

            ${isAdmin ? `<button onclick="del(${i})">Delete</button>` : ""}
        `;

        container.appendChild(el);
    });
}

/* ===== INTERACTIONS ===== */
function like(i){ posts[i].likes++; save(); }
function dislike(i){ posts[i].dislikes++; save(); }
function del(i){ posts.splice(i,1); save(); }

/* ===== COMMENTS ===== */
function comment(i){

    if (!currentUser && !isAdmin) {
        alert("Login first");
        return;
    }

    const text = prompt("Comment:");
    if (!text) return;

    const user = isAdmin
        ? (prompt("Admin name") || "ADMIN")
        : currentUser;

    posts[i].comments.push({user, text});
    save();
}

/* ===== PEOPLE ===== */
function joinPeople(){

    let name, action;

    if (isAdmin){
        name = prompt("Name:");
        action = prompt("Action:");
    } else {
        if (!currentUser){
            alert("Create account first");
            return;
        }

        if (people.some(p => p.name === currentUser)){
            alert("Already joined");
            return;
        }

        name = currentUser;
        action = prompt("What did you do?");
    }

    if (!name || !action) return;

    people.push({name, action});
    save();
}

/* ===== RENDER PEOPLE ===== */
function renderPeople(){
    const box = document.getElementById("people");
    box.innerHTML = "";

    people.forEach(p=>{
        const div = document.createElement("div");
        div.innerHTML = `<b>${p.name}</b>: ${p.action}`;
        box.appendChild(div);
    });
}

/* ===== SAVE ===== */
function save(){
    localStorage.setItem("posts", JSON.stringify(posts));
    localStorage.setItem("people", JSON.stringify(people));
    renderPosts();
    renderPeople();
}

/* ===== INIT ===== */
renderPosts();
renderPeople();

</script>

</body>
</html>
