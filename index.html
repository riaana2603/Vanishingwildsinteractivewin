<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>You Chose to Care</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    padding: 20px;
}

/* Buttons */
button {
    margin: 5px;
    padding: 6px 10px;
    cursor: pointer;
}

/* Post */
.post {
    background: rgba(255,255,255,0.05);
    padding: 12px;
    margin: 12px 0;
    border-radius: 10px;
    position: relative;
}

/* Comments (subtle, not a redesign) */
.commentsBox {
    margin-top: 8px;
    padding: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
}

/* People section */
.peopleBox {
    margin-top: 20px;
    padding: 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
}
</style>
</head>

<body>

<h2>You Chose to Care</h2>

<button onclick="createAccount()">Create Account</button>
<button onclick="toggleAdmin()">Admin Mode</button>
<button onclick="joinPeople()">Join People Who Care</button>
<button onclick="addPost()">Add Post</button>

<div id="posts"></div>

<div class="peopleBox">
    <h3>People Who Care</h3>
    <div id="people"></div>
</div>

<script>
const PASSWORD = "Care2026";

/* USER */
let currentUser = localStorage.getItem("currentUser") || null;
let isAdmin = localStorage.getItem("isAdmin") === "true";

/* DATA (SAFE LOAD) */
let posts = JSON.parse(localStorage.getItem("posts")) || [];
let comments = JSON.parse(localStorage.getItem("comments")) || {};
let people = JSON.parse(localStorage.getItem("people")) || [];

/* ACCOUNT */
function createAccount() {
    let name = prompt("Enter your name:");
    if (!name) return;
    currentUser = name;
    localStorage.setItem("currentUser", name);
}

/* ADMIN */
function toggleAdmin() {
    if (!isAdmin) {
        if (prompt("Password:") === PASSWORD) {
            isAdmin = true;
            localStorage.setItem("isAdmin", "true");
            alert("Admin ON");
        }
    } else {
        isAdmin = false;
        localStorage.setItem("isAdmin", "false");
        alert("Admin OFF");
    }
}

/* PEOPLE */
function joinPeople() {
    if (!currentUser && !isAdmin) {
        alert("Create account first");
        return;
    }

    if (!isAdmin) {
        if (people.find(p => p.name === currentUser)) {
            alert("You already joined!");
            return;
        }

        let action = prompt("What did you do?");
        if (!action) return;

        people.push({ name: currentUser, action });

    } else {
        let name = prompt("Name:");
        let action = prompt("Action:");
        if (!name || !action) return;

        people.push({ name, action });
    }

    savePeople();
}

function savePeople() {
    localStorage.setItem("people", JSON.stringify(people));
    renderPeople();
}

/* POSTS */
function addPost() {
    if (!currentUser && !isAdmin) {
        alert("Create account first");
        return;
    }

    let title = prompt("Title (optional):") || "";
    let text = prompt("Write your post:");
    let image = prompt("Image URL (optional):") || "";

    if (!text) return;

    let author = isAdmin
        ? (confirm("Post as admin?") ? "ADMIN" : prompt("Name:"))
        : currentUser;

    posts.unshift({
        title,
        text,   // OLD FORMAT
        body: text, // NEW FORMAT (compatibility)
        image,
        author,
        likes: 0,
        dislikes: 0
    });

    savePosts();
}

function savePosts() {
    localStorage.setItem("posts", JSON.stringify(posts));
    renderPosts();
}

/* REACTIONS */
function react(i, type) {
    if (type === "like") posts[i].likes = (posts[i].likes || 0) + 1;
    if (type === "dislike") posts[i].dislikes = (posts[i].dislikes || 0) + 1;
    savePosts();
}

/* COMMENTS */
function addComment(i) {
    if (!currentUser && !isAdmin) {
        alert("Create account first");
        return;
    }

    let text = prompt("Comment:");
    if (!text) return;

    let author = isAdmin
        ? (confirm("Admin comment?") ? "ADMIN" : prompt("Name:"))
        : currentUser;

    if (!comments[i]) comments[i] = [];

    comments[i].push({ text, author });
    saveComments();
}

function saveComments() {
    localStorage.setItem("comments", JSON.stringify(comments));
    renderPosts();
}

/* DELETE */
function deletePost(i) {
    if (prompt("Password:") !== PASSWORD) return;
    posts.splice(i, 1);
    savePosts();
}

/* RENDER POSTS */
function renderPosts() {
    let container = document.getElementById("posts");
    container.innerHTML = "";

    posts.forEach((p, i) => {

        let text = p.body || p.text || ""; // 🔥 DATA FIX

        let div = document.createElement("div");
        div.className = "post";

        div.innerHTML = `
            <div style="display:flex; justify-content:space-between;">
                <b>${p.author === "ADMIN" ? "👑 ADMIN" : p.author || "Unknown"}</b>
                ${isAdmin ? `<span onclick="deletePost(${i})">🗑</span>` : ""}
            </div>

            ${p.title ? `<h3>${p.title}</h3>` : ""}
            <div>${text}</div>

            ${p.image ? `<img src="${p.image}" style="max-width:100%">` : ""}

            <div>
                👍 ${p.likes || 0}
                <button onclick="react(${i}, 'like')">Like</button>

                👎 ${p.dislikes || 0}
                <button onclick="react(${i}, 'dislike')">Dislike</button>
            </div>

            <button onclick="addComment(${i})">Comment</button>

            <div class="commentsBox">
                ${(comments[i] || []).map(c => `
                    <div><b>${c.author === "ADMIN" ? "👑 ADMIN" : c.author}:</b> ${c.text}</div>
                `).join("")}
            </div>
        `;

        container.appendChild(div);
    });
}

/* RENDER PEOPLE */
function renderPeople() {
    let container = document.getElementById("people");
    container.innerHTML = "";

    people.forEach(p => {
        let div = document.createElement("div");
        div.innerHTML = `<b>${p.name}</b>: ${p.action}`;
        container.appendChild(div);
    });
}

/* INIT */
renderPosts();
renderPeople();
</script>

</body>
</html>
