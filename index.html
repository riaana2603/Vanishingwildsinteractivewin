<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>You Chose to Care</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
}

/* HERO */
.hero {
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    padding-top: 80px;
}

/* TEXT */
.hero h1 {
    font-size: 48px;
}

.hero p {
    max-width: 600px;
}

/* GLASS UI */
.glass {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding: 15px;
    border-radius: 16px;
    margin-top: 20px;
    width: 90%;
    max-width: 600px;
}

/* INPUT AREA */
.inputRow {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: none;
}

/* BUTTONS */
button {
    padding: 8px 14px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

/* POST */
.post {
    text-align: left;
    margin-top: 15px;
}

.post img {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
}

/* COMMENTS */
.commentsBox {
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.2);
}

/* PEOPLE */
.peopleSection {
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="hero">

<h1>You Chose to Care</h1>
<p>Wildfires are destroying habitats. A few people choose to act instead of scroll.</p>

<!-- CONTROL PANEL -->
<div class="glass">
    <button onclick="createAccount()">Create Account</button>
    <button onclick="toggleAdmin()">Admin Mode</button>
    <button onclick="joinPeople()">Join</button>
</div>

<!-- POST INPUT -->
<div class="glass">
    <div class="inputRow">
        <input id="postInput" placeholder="Write something...">
        <button onclick="addPost()">Post</button>
    </div>
</div>

<!-- POSTS -->
<div id="posts"></div>

<!-- PEOPLE -->
<div class="glass peopleSection">
    <h2>People Who Care</h2>
    <div id="people"></div>
</div>

</div>

<script>

/* =========================
   STATE MANAGEMENT
========================= */

let posts = JSON.parse(localStorage.getItem("posts")) || [];
let people = JSON.parse(localStorage.getItem("people")) || [];

let currentUser = localStorage.getItem("user") || null;
let isAdmin = false;

/* =========================
   ACCOUNT SYSTEM
========================= */

function createAccount() {
    const name = prompt("Enter your name:");
    if (!name) return;

    currentUser = name;
    localStorage.setItem("user", name);
}

/* =========================
   ADMIN SYSTEM
========================= */

function toggleAdmin() {
    if (!isAdmin) {
        const password = prompt("Enter admin password:");
        if (password === "admin123") {
            isAdmin = true;
            alert("Admin mode enabled");
        }
    } else {
        isAdmin = false;
        alert("Admin mode disabled");
    }
}

/* =========================
   POST CREATION
========================= */

function addPost() {

    if (!currentUser && !isAdmin) {
        alert("Create an account first.");
        return;
    }

    const input = document.getElementById("postInput");
    const bodyText = input.value.trim();

    if (!bodyText) return;

    const title = prompt("Enter title (optional):");
    const image = prompt("Enter image URL (optional):");

    const author = isAdmin
        ? (prompt("Enter admin display name or leave blank") || "ADMIN")
        : currentUser;

    const newPost = {
        title: title || "",
        body: bodyText,
        text: bodyText, // backward compatibility
        image: image || "",
        author: author,
        likes: 0,
        dislikes: 0,
        comments: []
    };

    posts.unshift(newPost);

    input.value = "";
    saveData();
}

/* =========================
   POST RENDERING
========================= */

function renderPosts() {

    const container = document.getElementById("posts");
    container.innerHTML = "";

    posts.forEach((post, index) => {

        const contentText = post.body || post.text || "";

        const postElement = document.createElement("div");
        postElement.className = "glass post";

        postElement.innerHTML = `
            ${post.title ? `<h3>${post.title}</h3>` : ""}
            <p>${contentText}</p>
            ${post.image ? `<img src="${post.image}">` : ""}

            <div>
                ❤️ ${post.likes || 0}
                <button onclick="likePost(${index})">Like</button>

                👎 ${post.dislikes || 0}
                <button onclick="dislikePost(${index})">Dislike</button>
            </div>

            <button onclick="addComment(${index})">Comment</button>

            <div class="commentsBox">
                ${(post.comments || []).map(c =>
                    `<div><b>${c.user}:</b> ${c.text}</div>`
                ).join("")}
            </div>

            ${isAdmin ? `<button onclick="deletePost(${index})">Delete</button>` : ""}
        `;

        container.appendChild(postElement);
    });
}

/* =========================
   POST INTERACTIONS
========================= */

function likePost(index) {
    posts[index].likes = (posts[index].likes || 0) + 1;
    saveData();
}

function dislikePost(index) {
    posts[index].dislikes = (posts[index].dislikes || 0) + 1;
    saveData();
}

function deletePost(index) {
    posts.splice(index, 1);
    saveData();
}

/* =========================
   COMMENTS
========================= */

function addComment(index) {

    if (!currentUser && !isAdmin) {
        alert("Create account first.");
        return;
    }

    const text = prompt("Enter your comment:");
    if (!text) return;

    const user = isAdmin
        ? (prompt("Admin display name or blank") || "ADMIN")
        : currentUser;

    posts[index].comments.push({ user, text });

    saveData();
}

/* =========================
   PEOPLE SYSTEM
========================= */

function joinPeople() {

    let name;
    let action;

    if (isAdmin) {
        name = prompt("Enter person's name:");
        action = prompt("Enter their action:");
    } else {
        if (!currentUser) {
            alert("Create account first.");
            return;
        }

        name = currentUser;

        const alreadyJoined = people.some(p => p.name === name);
        if (alreadyJoined) {
            alert("You already joined.");
            return;
        }

        action = prompt("What did you do?");
    }

    if (!name || !action) return;

    people.push({ name, action });
    saveData();
}

function renderPeople() {

    const container = document.getElementById("people");
    container.innerHTML = "";

    people.forEach(person => {
        const div = document.createElement("div");
        div.innerHTML = `<b>${person.name}</b>: ${person.action}`;
        container.appendChild(div);
    });
}

/* =========================
   STORAGE
========================= */

function saveData() {
    localStorage.setItem("posts", JSON.stringify(posts));
    localStorage.setItem("people", JSON.stringify(people));
    renderPosts();
    renderPeople();
}

/* =========================
   INIT
========================= */

renderPosts();
renderPeople();

</script>

</body>
</html>
