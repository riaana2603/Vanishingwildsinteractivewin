<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>You Chose to Care</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: white;
    text-align: center;

    background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.75)),
        url('https://images.unsplash.com/photo-1501785888041-af3ef285b470');

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.container { margin-top: 120px; }

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
}

.info {
    opacity: 0.85;
    max-width: 500px;
    margin: auto;
}

/* BUTTONS */
button {
    margin: 10px;
    padding: 12px 20px;
    border-radius: 25px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: white;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: rgba(255,255,255,0.35);
}

/* PANEL */
#panel {
    position: fixed;
    right: 0;
    top: 0;
    width: 320px;
    height: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    padding: 20px;
    transform: translateX(100%);
    transition: 0.3s;
    display: flex;
    flex-direction: column;
}

#panel.active { transform: translateX(0); }

#nameList {
    flex: 1;
    overflow-y: auto;
}

/* NAME ITEM */
.nameItem {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    margin: 6px 0;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    position: relative;
}

/* MENU */
.menuBtn { cursor: pointer; }

.dropdown {
    position: absolute;
    right: 10px;
    top: 40px;
    background: rgba(0,0,0,0.95);
    border-radius: 8px;
    display: none;
    flex-direction: column;
    z-index: 100;
}

.dropdown button {
    background: none;
    border: none;
    color: white;
    padding: 8px;
    text-align: left;
}

/* VIEW CARD */
#viewBox {
    margin-top: 12px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    font-size: 14px;
}

/* DIVIDER */
.divider {
    width: 80%;
    height: 1px;
    background: rgba(255,255,255,0.3);
    margin: 40px auto;
}

/* POSTS */
#posts {
    max-width: 650px;
    margin: auto;
    text-align: left;
}

.post {
    background: rgba(255,255,255,0.08);
    padding: 14px;
    margin-top: 14px;
    border-radius: 12px;
}

/* COMMENT SECTION */
.commentSection {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.2);
}

.commentBox {
    position: relative;
    background: rgba(255,255,255,0.05);
    padding: 6px;
    border-radius: 6px;
    margin-top: 5px;
    font-size: 13px;
}

.deleteIcon {
    position: absolute;
    right: 5px;
    top: 2px;
    cursor: pointer;
}

</style>
</head>

<body>

<div class="container">
    <h1>You Chose to Care</h1>

    <p class="info">
        Wildfires are destroying habitats. A few people choose to act instead of scroll.
    </p>

    <div id="count">0 people</div>

    <button onclick="join()">Join</button>
    <button onclick="togglePanel()">People Who Care</button>
</div>

<!-- PANEL -->
<div id="panel">
    <h3>People Who Care</h3>
    <div id="nameList"></div>
</div>

<div class="divider"></div>

<!-- POSTS -->
<div id="posts">
    <h2>Community Posts</h2>

    <input id="postInput" placeholder="Write something..."
        style="width:70%; padding:10px; border-radius:10px; border:none;">
    <button onclick="addPost()">Post</button>

    <div id="postList"></div>
</div>

<script>

const PASSWORD = "Care2026";

let data = JSON.parse(localStorage.getItem("data") || "[]");
let posts = JSON.parse(localStorage.getItem("posts") || "[]");

/* SAVE */
function save() {
    localStorage.setItem("data", JSON.stringify(data));
}

function savePosts() {
    localStorage.setItem("posts", JSON.stringify(posts));
    renderPosts();
}

/* JOIN */
function join() {
    let name = prompt("Enter your name:");
    if (!name) return;

    let action = prompt("What will you do?");
    data.push({ name: name.trim(), action: action || "" });

    save();
    render();
}

/* RENDER PEOPLE */
function render() {
    document.getElementById("count").innerText = data.length + " people";

    const list = document.getElementById("nameList");
    list.innerHTML = "";

    data.forEach((p, i) => {
        const div = document.createElement("div");
        div.className = "nameItem";

        div.innerHTML = `
            <span>${p.name}</span>
            <span class="menuBtn" onclick="toggleMenu(${i})">⋯</span>

            <div class="dropdown" id="menu-${i}">
                <button onclick="viewAction(${i})">View</button>
                <button onclick="editPerson(${i})">Edit</button>
                <button onclick="deletePerson(${i})">Delete</button>
            </div>
        `;

        list.appendChild(div);
    });
}

/* MENU */
function toggleMenu(i) {
    document.querySelectorAll(".dropdown").forEach(d => d.style.display = "none");
    const menu = document.getElementById("menu-" + i);
    menu.style.display = menu.style.display === "flex" ? "none" : "flex";
}

/* VIEW (FIXED + IMPROVED) */
function viewAction(i) {
    let box = document.getElementById("viewBox");
    if (!box) {
        box = document.createElement("div");
        box.id = "viewBox";
        document.getElementById("panel").appendChild(box);
    }

    box.innerHTML = `
        <strong>${data[i].name}</strong><br>
        ${data[i].action || "No action added"}
    `;
}

/* EDIT */
function editPerson(i) {
    if (prompt("Password:") !== PASSWORD) return alert("Wrong password");

    let name = prompt("Edit name:", data[i].name);
    let action = prompt("Edit action:", data[i].action);

    if (name) data[i].name = name;
    data[i].action = action || "";

    save();
    render();
}

/* DELETE */
function deletePerson(i) {
    if (prompt("Password:") !== PASSWORD) return alert("Wrong password");

    data.splice(i, 1);
    save();
    render();
}

/* POSTS */
function addPost() {
    let input = document.getElementById("postInput");
    if (!input.value.trim()) return;

    posts.push({
        text: input.value,
        likes: 0,
        liked: false,
        comments: []
    });

    input.value = "";
    savePosts();
}

/* LIKE */
function likePost(i) {
    posts[i].liked = !posts[i].liked;
    posts[i].likes += posts[i].liked ? 1 : -1;
    savePosts();
}

/* COMMENT */
function commentPost(i) {
    let c = prompt("Comment:");
    if (!c) return;

    posts[i].comments.push(c);
    savePosts();
}

/* DELETE COMMENT */
function deleteComment(pi, ci) {
    if (prompt("Password:") !== PASSWORD) return alert("Wrong password");

    posts[pi].comments.splice(ci, 1);
    savePosts();
}

/* RENDER POSTS */
function renderPosts() {
    const box = document.getElementById("postList");
    box.innerHTML = "";

    posts.forEach((p, i) => {
        const div = document.createElement("div");
        div.className = "post";

        div.innerHTML = `
            <div>${p.text}</div>

            <div>
                ❤️ ${p.likes}
                <button onclick="likePost(${i})">
                    ${p.liked ? "Unlike" : "Like"}
                </button>
                <button onclick="commentPost(${i})">Comment</button>
            </div>

            <div class="commentSection">
                ${p.comments.map((c, ci) => `
                    <div class="commentBox">
                        💬 ${c}
                        <span class="deleteIcon" onclick="deleteComment(${i}, ${ci})">🗑</span>
                    </div>
                `).join("")}
            </div>
        `;

        box.appendChild(div);
    });
}

/* PANEL */
function togglePanel() {
    document.getElementById("panel").classList.toggle("active");
}

/* INIT */
render();
renderPosts();

</script>

</body>
</html>
